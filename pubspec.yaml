name: go_sport
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+20

environment:
    sdk: ^3.9.2

dependencies:
    flutter:
        sdk: flutter
    cupertino_icons: ^1.0.8

    freezed_annotation: ^2.4.4
    json_annotation: ^4.9.0

    flutter_riverpod: ^2.5.1
    google_sign_in: ^7.2.0
    cached_network_image: ^3.4.1
    google_fonts: ^6.2.1
    flutter_svg: ^2.0.10+1

    # Audio
    just_audio: ^0.9.42

    # Navigation
    go_router: ^17.0.0
    audio_service: ^0.18.18

    # Network
    dio: ^5.7.0
    flutter_secure_storage: ^9.2.2
    image_picker: ^1.2.1
    # Pure-Dart image processing — bake EXIF orientation into pixels before upload
    image: ^4.3.0

    # External links
    url_launcher: ^6.3.0
    connectivity_plus: ^4.0.1

    # Push Notifications
    firebase_messaging: 16.3.0
    firebase_core: 4.10.0

    # Local Notifications
    flutter_local_notifications: ^17.2.3
    timezone: ^0.9.4

    intl: ^0.19.0

    # Local storage
    shared_preferences: ^2.3.2

    # App directories (materialize bundled fallback artwork for system player)
    path_provider: ^2.1.4

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^5.0.0

    build_runner: ^2.4.13
    freezed: ^2.5.7
    json_serializable: ^6.8.0

    # Generates native launcher icons from assets/launcher/ sources
    flutter_launcher_icons: ^0.14.1

# Launcher icon generation: dart run flutter_launcher_icons
# Sources in assets/launcher/ are NOT bundled into the app (folder is not
# declared under flutter/assets) — they are read only at generation time.
flutter_launcher_icons:
    android: true
    ios: true
    image_path: "assets/launcher/app_icon.png"
    adaptive_icon_background: "#FFFFFF"
    adaptive_icon_foreground: "assets/launcher/app_icon_adaptive.png"
    remove_alpha_ios: true

flutter:
    uses-material-design: true
    assets:
        - assets/icons/
        - assets/images/
        - assets/blobs/sdf/

    shaders:
        - lib/features/player/presentation/player/shaders/fluid_blur.frag
        - lib/features/player/presentation/player/shaders/blob.frag

    fonts:
        - family: Montserrat # Используем для основного текста
          fonts:
              - asset: assets/fonts/montserrat/Montserrat-Thin.ttf
                weight: 100
              - asset: assets/fonts/montserrat/Montserrat-Light.ttf
                weight: 300
              - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
                weight: 400
              - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
                weight: 500
              - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
                weight: 700

        - family: Montserratarm
          fonts:
              - asset: assets/fonts/montserrat/Montserratarm-Thin.otf
                weight: 100
              - asset: assets/fonts/montserrat/Montserratarm-Light.ttf
                weight: 300
              - asset: assets/fonts/montserrat/Montserratarm-Regular.ttf
                weight: 400
              - asset: assets/fonts/montserrat/Montserratarm-Medium.ttf
                weight: 500
              - asset: assets/fonts/montserrat/Montserratarm-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/montserrat/Montserratarm-Bold.ttf
                weight: 700

        - family: Noah
          fonts:
              - asset: assets/fonts/noah/Noh95_Am.ttf
                weight: 500
